<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0c10'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23b3232b'/%3E%3C/svg%3E" />
<title>Sincrobattito — Regia</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="veins"></div>
<div class="conn-banner" id="connBanner">Connessione persa — riconnessione…</div>
<div class="screen host-screen">
  <div class="host-grid">
    <div class="host-col-game">
      <div class="invite-box" id="inviteBox">
        <span class="invite-label">I giocatori si uniscono scansionando</span>
        <div class="qr-box"><img id="qrImg" alt="QR per unirsi" width="140" height="140" /></div>
        <span class="join-url" id="joinUrl"></span>
      </div>

      <div class="progress-dots" id="dots"></div>

      <div class="pulse-wrap">
        <div class="pulse-ring" id="ring"></div>
        <div class="pulse-core" id="core">IN ATTESA</div>
      </div>

      <ul class="player-list" id="playerList"></ul>

      <div class="levels-row" id="levelsRow"></div>

      <div class="controls-row" id="setupControls">
        <div class="field">BPM
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="bpm" value="66" min="30" max="120" />
        </div>
        <div class="field">Battiti richiesti
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="target" value="8" min="1" max="20" />
        </div>
        <div class="field">Tolleranza (ms)
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="windowMs" value="600" min="300" max="2000" step="50" />
        </div>
        <div class="field">Finte (%)
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="skipChance" value="20" min="0" max="60" step="5" />
        </div>
      </div>

      <div class="controls-row">
        <button id="saveLevelBtn" class="secondary">Salva nel livello…</button>
      </div>

      <div class="controls-row">
        <button id="startBtn">Avvia la valvola</button>
        <button id="resetBtn" class="secondary">Reset tentativo</button>
        <button id="resetFakesBtn" class="secondary">Azzera tutti i contatori finte</button>
        <button id="hardResetBtn" class="ghost">Reset totale (rimuove giocatori)</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/host.js"></script>
</body>
</html>
