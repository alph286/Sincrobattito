<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0c10'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23b3232b'/%3E%3C/svg%3E" />
<title>Sincrobattito</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="veins"></div>
<div class="conn-banner" id="connBanner">Connessione persa — riconnessione…</div>

<div class="screen" id="joinScreen" style="display:none;">
  <form class="name-form" id="joinForm">
    <input type="text" id="nameInput" placeholder="Nome" maxlength="24" autocomplete="off" required />
    <button type="submit">Accedi</button>
  </form>
</div>

<div class="screen" id="gameScreen" style="display:none;">
  <div class="cue-label" id="cueLabel"></div>
  <div class="progress-dots" id="dots"></div>

  <div class="pulse-wrap">
    <div class="pulse-ring" id="ring"></div>
    <div class="pulse-core" id="core"></div>
  </div>

  <div class="fake-count" id="fakeCount">0</div>
</div>

<script src="/bg-shader.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/play.js"></script>
</body>
</html>
