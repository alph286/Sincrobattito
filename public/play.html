<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Sincrobattito</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="veins"></div>

<div class="screen" id="joinScreen">
  <form class="name-form" id="joinForm">
    <input type="text" id="nameInput" placeholder="Inserisci il tuo nome" maxlength="24" autocomplete="off" required />
    <button type="submit">Accedi</button>
  </form>
</div>

<div class="screen" id="gameScreen" style="display:none;">
  <div class="pulse-wrap">
    <div class="pulse-ring"></div>
    <div class="pulse-core" id="core"></div>
  </div>

  <div class="progress-dots" id="dots"></div>
</div>

<script src="/bg-shader.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/play.js"></script>
</body>
</html>
